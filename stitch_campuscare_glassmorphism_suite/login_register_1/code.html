<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .floating-object {
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#b0c6ff",
                        "surface-tint": "#2b5bb5",
                        "on-primary-fixed": "#001945",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb4ac",
                        "surface-container-high": "#e6e8eb",
                        "on-secondary-fixed": "#261a00",
                        "inverse-on-surface": "#eff1f4",
                        "surface-bright": "#f7f9fc",
                        "background": "#f7f9fc",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed-variant": "#5b4300",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadd",
                        "secondary-container": "#fdc003",
                        "on-tertiary-fixed-variant": "#93000e",
                        "outline-variant": "#c3c6d4",
                        "inverse-primary": "#b0c6ff",
                        "on-tertiary-fixed": "#410003",
                        "surface-container-highest": "#e0e3e6",
                        "primary": "#003178",
                        "tertiary": "#720009",
                        "tertiary-fixed": "#ffdad6",
                        "surface-variant": "#e0e3e6",
                        "on-background": "#191c1e",
                        "on-secondary-container": "#6c5000",
                        "on-primary": "#ffffff",
                        "primary-container": "#0d47a1",
                        "surface": "#f7f9fc",
                        "on-primary-fixed-variant": "#00429c",
                        "tertiary-container": "#9d0010",
                        "error": "#ba1a1a",
                        "secondary": "#785900",
                        "on-tertiary-container": "#ffa59c",
                        "secondary-fixed": "#ffdf9e",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef1",
                        "on-primary-container": "#a1bbff",
                        "secondary-fixed-dim": "#fabd00",
                        "on-surface-variant": "#434652",
                        "outline": "#737783",
                        "primary-fixed": "#d9e2ff",
                        "surface-container-low": "#f2f4f7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-md": "24px",
                        "gutter": "16px",
                        "stack-lg": "40px",
                        "stack-sm": "12px",
                        "container-padding": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "h1": ["Space Grotesk"],
                        "body-sm": ["Inter"],
                        "h3": ["Space Grotesk"],
                        "h2": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                        "h3": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary min-h-screen flex items-center justify-center p-gutter relative overflow-hidden font-body-md text-on-surface">
<!-- Dynamic Collage Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-10 left-10 w-32 h-32 opacity-20 floating-object bg-gradient-to-br from-secondary-container to-transparent rounded-full blur-3xl"></div>
<div class="absolute bottom-20 right-10 w-64 h-64 opacity-10 floating-object bg-gradient-to-tl from-primary-container to-transparent rounded-full blur-3xl"></div>
<!-- Abstract Icons (Broken desk, pipe etc represented by high-end geometric shapes) -->
<div class="absolute top-[15%] left-[10%] rotate-12 opacity-40">
<span class="material-symbols-outlined text-[120px] text-primary-fixed-dim" data-icon="desk">desk</span>
</div>
<div class="absolute bottom-[20%] right-[5%] -rotate-45 opacity-30">
<span class="material-symbols-outlined text-[100px] text-tertiary-fixed-dim" data-icon="water_drop">water_drop</span>
</div>
<div class="absolute top-[60%] left-[5%] rotate-[-15deg] opacity-25">
<span class="material-symbols-outlined text-[80px] text-secondary-fixed" data-icon="construction">construction</span>
</div>
<div class="absolute top-[5%] right-[15%] rotate-45 opacity-20">
<span class="material-symbols-outlined text-[90px] text-primary-container" data-icon="plumbing">plumbing</span>
</div>
</div>
<!-- Main Auth Canvas -->
<main class="relative z-10 w-full max-w-md">
<div class="glass-card rounded-[32px] p-8 shadow-2xl flex flex-col gap-stack-md relative overflow-hidden">
<!-- Header Section -->
<div class="text-center space-y-2">
<h1 class="font-h1 text-[40px] text-secondary-container tracking-tighter leading-none">CampusCare</h1>
<p class="font-body-md text-primary-fixed-dim font-medium tracking-wide">Report. Track. Resolve.</p>
</div>
<!-- Login Form (Initial State) -->
<form class="flex flex-col gap-stack-sm mt-4">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-primary-fixed-dim group-focus-within:text-secondary-container transition-colors">
<span class="material-symbols-outlined" data-icon="alternate_email">alternate_email</span>
</div>
<input class="w-full h-14 bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 text-white placeholder:text-white/40 focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all outline-none font-body-md" placeholder="Campus Email" type="email"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-primary-fixed-dim group-focus-within:text-secondary-container transition-colors">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
</div>
<input class="w-full h-14 bg-white/5 border border-white/10 rounded-2xl pl-12 pr-4 text-white placeholder:text-white/40 focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all outline-none font-body-md" placeholder="Password" type="password"/>
</div>
<div class="flex justify-end">
<button class="text-secondary-container text-body-sm font-semibold hover:underline" type="button">Forgot Password?</button>
</div>
<!-- Sign In Button (Triggers Demo Sheet) -->
<button class="w-full h-14 bg-secondary-container text-primary font-bold text-lg rounded-2xl shadow-lg shadow-secondary-container/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="button">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social/Other Methods -->
<div class="relative flex items-center gap-4 my-2">
<div class="flex-grow border-t border-white/10"></div>
<span class="text-white/40 text-[12px] font-bold uppercase tracking-widest">or login with</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 rounded-xl bg-white/5 border border-white/10 text-white hover:bg-white/10 transition-all">
<img alt="" class="w-5 h-5" data-alt="The official Google brand logo with its signature four-color palette of blue, red, yellow, and green. The logo is rendered in a clean, minimalist style with high-resolution vector clarity. The background is a soft, neutral grey within a modern app interface setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDG0tLKSBJrL_KhUBYA_Y-GqG1NU6BAq0LE3b71OhUb8cDb_krDuGJc0U21Gc89G4jyCUUnRL8dPSYbxi69Qv2S7l61LROF5ZqCToyttMu8AO4z5jI_jYJnHqBw2HJo-aMRtgE8MMECZRv6ST7I49T3NmyViEVw1tShzDgPs5L3mOOar80KJVefFe8tAyglgH6EcP2eyjBbJsWAG3PMUK4Lyr8bE9-1T3UmJgyKjk4Bv5nZseIRkWJlppvsamtti7Oxf_V7fohaJJSG"/>
<span class="font-body-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-12 rounded-xl bg-white/5 border border-white/10 text-white hover:bg-white/10 transition-all">
<span class="material-symbols-outlined text-white" data-icon="fingerprint">fingerprint</span>
<span class="font-body-sm font-semibold">Biometric</span>
</button>
</div>
<!-- Toggle Register -->
<div class="text-center mt-2">
<p class="text-white/60 font-body-sm">
                    Don't have an account? 
                    <button class="text-secondary-container font-bold hover:underline ml-1">Register</button>
</p>
</div>
</div>
</main>
<!-- Simulated Demo Role Bottom Sheet (Overlay) -->
<div class="fixed inset-0 z-50 bg-primary/80 backdrop-blur-md flex items-end justify-center p-4">
<div class="w-full max-w-md glass-card rounded-t-[40px] rounded-b-[20px] p-8 border-b-0 shadow-[0_-20px_50px_rgba(0,0,0,0.5)] flex flex-col gap-stack-md translate-y-0 transition-transform duration-500">
<div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-2"></div>
<div class="text-center space-y-1">
<h3 class="font-h3 text-white text-2xl">Select Demo Role</h3>
<p class="text-white/40 font-body-sm">Choose how you'd like to experience CampusCare</p>
</div>
<div class="flex flex-col gap-3">
<!-- Role: Student -->
<button class="group flex items-center justify-between p-5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-left">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-primary-container/30 flex items-center justify-center text-primary-fixed-dim group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="school">school</span>
</div>
<div>
<span class="block text-white font-bold text-lg">Student</span>
<span class="block text-white/40 text-sm">Report and track campus issues</span>
</div>
</div>
<span class="material-symbols-outlined text-white/20 group-hover:text-secondary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Role: Admin -->
<button class="group flex items-center justify-between p-5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-left">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-secondary-container/20 flex items-center justify-center text-secondary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<div>
<span class="block text-white font-bold text-lg">Staff Admin</span>
<span class="block text-white/40 text-sm">Manage work orders and updates</span>
</div>
</div>
<span class="material-symbols-outlined text-white/20 group-hover:text-secondary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Role: Super Admin -->
<button class="group flex items-center justify-between p-5 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all text-left">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-tertiary-container/30 flex items-center justify-center text-tertiary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="shield_person">shield_person</span>
</div>
<div>
<span class="block text-white font-bold text-lg">Super Admin</span>
<span class="block text-white/40 text-sm">Full system access and analytics</span>
</div>
</div>
<span class="material-symbols-outlined text-white/20 group-hover:text-secondary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<button class="text-white/60 font-semibold text-center mt-2 hover:text-white transition-colors">Cancel</button>
</div>
</div>
<!-- Floating Background Details for Texture -->
<div class="absolute inset-0 z-[-1] opacity-50">
<div class="absolute top-[20%] right-[10%] w-[500px] h-[500px] bg-primary-container rounded-full blur-[160px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary-container/10 rounded-full blur-[120px]"></div>
</div>
<!-- Hero Image Decoration (hidden on small screens, visual balance on larger) -->
<div class="hidden lg:block absolute right-12 top-1/2 -translate-y-1/2 w-[40vw] h-[530px]">
<img class="w-full h-full object-cover rounded-[60px] opacity-20 contrast-125 grayscale mix-blend-screen" data-alt="An expansive aerial view of a prestigious university campus featuring historical brick architecture and winding green pathways. The scene is captured during the golden hour, casting long, soft shadows and a warm glow over the entire educational landscape. The overall atmosphere is one of intellectual tradition and quiet modern efficiency." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAx9ipfxrWa03v6dixJtyLlunGkWXVi0n7VGhFDl2UIvATRoH6jUoByg6F4bVGBChLEGy_sE0IAI4xsVA1uKPwrohfa774A40gvs-0ca05lvqgBVKHLD9M_oUyjMHm2YB6g4EzNzD0OezarsloqAAEiQ5_srWVX470CLJ_erBbVvma1GeVyWnPox359QYVYP2hBwZhuhqQmbK8aQCgpuL383LjY8BGqLvd3pkP-2XcLBMetLVkyPjNTN6H_cKcwikw4pSlOii-j2jIg"/>
</div>
</body></html>
